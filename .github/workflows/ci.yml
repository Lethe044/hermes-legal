name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev + optional extras
        run: pip install -e ".[all,dev]"

      - name: Run tests
        run: pytest -v

      - name: Smoke test CLI
        run: |
          hermes-legal providers
          hermes-legal analyze sample_contracts/freelance_contract.txt --provider offline --no-save
          hermes-legal analyze sample_contracts/freelance_contract.txt --provider offline --no-save --format json
          hermes-legal batch sample_contracts --provider offline --no-browser --reports-dir /tmp/hermes_ci_batch
          hermes-legal generate nda --field party_a=Acme --field party_b=Beta --output /tmp/nda.txt
          hermes-legal playbook init --path /tmp/playbook.yaml
          hermes-legal ask sample_contracts/freelance_contract.txt "what is the termination notice period?" --provider offline
          hermes-legal analyze sample_contracts/nda_contract.txt --provider offline --explain --no-save
          hermes-legal deadlines
          hermes-legal portfolio --no-browser --output /tmp/portfolio.html
