name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev + optional extras
        run: pip install -e ".[all,dev]"

      - name: Run tests
        run: pytest -v

      - name: Smoke test CLI
        run: |
          hermes-legal providers
          hermes-legal analyze sample_contracts/freelance_contract.txt --provider offline --no-save
