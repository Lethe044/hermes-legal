name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: The exact hermes-legal command, e.g. `hermes-legal analyze contract.pdf --provider groq`
      render: shell
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider
      description: Output of `hermes-legal providers`, or which provider you used.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: hermes-legal-advisor version
      description: Output of `hermes-legal --version`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Full error message or traceback, if any.
      render: shell
    validations:
      required: false
  - type: textarea
    id: sample
    attributes:
      label: Minimal contract sample (optional)
      description: A redacted snippet of contract text that reproduces the issue, if applicable. Never paste a real, unredacted contract.
    validations:
      required: false
