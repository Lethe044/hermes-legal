name: "Hermes Legal Advisor - Contract Check"
description: >
  Automatically scans contract files (.txt, .md, .pdf, .docx) changed in a
  pull request, posts a risk summary to the job summary, and - when a
  GitHub token is provided - posts (and updates) a comment directly on
  the pull request. Works with free providers (Groq, Gemini) or
  completely offline with no API key at all.
author: "Lethe044"
branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "File or folder of contracts to scan."
    required: true
    default: "."
  provider:
    description: "groq | gemini | openrouter | ollama | offline | auto"
    required: false
    default: "auto"
  perspective:
    description: "Whose side to review from: client, vendor, contractor, employer, employee, neutral, ..."
    required: false
    default: "neutral"
  fail-on-risk:
    description: "Comma-separated risk levels that should fail the job, e.g. CRITICAL,HIGH. Leave empty to never fail."
    required: false
    default: ""
  groq-api-key:
    description: "Optional GROQ_API_KEY for free-tier Groq inference."
    required: false
    default: ""
  gemini-api-key:
    description: "Optional GEMINI_API_KEY for free-tier Gemini inference."
    required: false
    default: ""
  github-token:
    description: "Pass ${{ secrets.GITHUB_TOKEN }} to enable posting the risk summary as a pull request comment. Leave empty to only write the job step summary."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Hermes Legal Advisor
      shell: bash
      run: pip install "hermes-legal-advisor[all]"

    - name: Run contract scan
      shell: bash
      env:
        GROQ_API_KEY: ${{ inputs.groq-api-key }}
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
      run: |
        set -e
        TARGET="${{ inputs.path }}"
        PROVIDER="${{ inputs.provider }}"
        PERSPECTIVE="${{ inputs.perspective }}"
        FAIL_ON="${{ inputs.fail-on-risk }}"
        COMMENT_BODY="$RUNNER_TEMP/hermes_pr_comment.md"

        echo "## Hermes Legal Advisor - Contract Review" > "$COMMENT_BODY"

        FAIL_ARGS=()
        if [ -n "$FAIL_ON" ]; then
          FAIL_ARGS=(--fail-on-risk "$FAIL_ON")
        fi

        if [ -d "$TARGET" ]; then
          hermes-legal batch "$TARGET" --provider "$PROVIDER" --perspective "$PERSPECTIVE" \
            --reports-dir "$RUNNER_TEMP/hermes_reports"
          if [ -f "$RUNNER_TEMP/hermes_reports/batch_summary.csv" ]; then
            echo "" >> "$COMMENT_BODY"
            echo "| file | contract_type | overall_risk | verdict | red_flag_count |" >> "$COMMENT_BODY"
            echo "|---|---|---|---|---|" >> "$COMMENT_BODY"
            tail -n +2 "$RUNNER_TEMP/hermes_reports/batch_summary.csv" | \
              awk -F',' '{print "| "$1" | "$2" | "$5" | "$6" | "$7" |"}' >> "$COMMENT_BODY"
          fi
        else
          hermes-legal analyze "$TARGET" --provider "$PROVIDER" --perspective "$PERSPECTIVE" \
            --output "$RUNNER_TEMP/report.md" "${FAIL_ARGS[@]}"
          echo "" >> "$COMMENT_BODY"
          cat "$RUNNER_TEMP/report.md" >> "$COMMENT_BODY"
        fi

        echo "" >> "$COMMENT_BODY"
        echo "_Posted by [Hermes Legal Advisor](https://github.com/Lethe044/hermes-legal)._" >> "$COMMENT_BODY"
        cat "$COMMENT_BODY" >> "$GITHUB_STEP_SUMMARY"

    - name: Post or update pull request comment
      if: inputs.github-token != '' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const path = `${process.env.RUNNER_TEMP}/hermes_pr_comment.md`;
          const body = fs.readFileSync(path, 'utf8');
          const marker = '## Hermes Legal Advisor - Contract Review';

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
